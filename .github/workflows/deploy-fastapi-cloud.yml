name: Deploy to FastAPI Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fastapi-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fastapi-cloud
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      # FastAPI Cloud does not build frontends; build into backend/app/frontend
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run --filter frontend build
      # uv.lock sits at the workspace root, outside the uploaded backend/ directory
      - name: Export locked dependencies
        run: uv export --frozen --package app --no-dev --no-emit-workspace --format pylock.toml -o backend/pylock.toml
      # Additive migrations run before the new code goes live
      - name: Migrate database
        run: uv run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
      - name: Deploy
        run: uv run fastapi deploy
        working-directory: backend
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
